<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Compare</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; }
  table { border-collapse: collapse; }
  th, td { padding: 6px 10px; border-bottom: 1px solid #ddd; }
  tr:hover td { background: #f5f5f5; }
  td:first-child { padding-right: 40px; }          /* space after the product name */
  td:nth-child(2) { text-align: right; }           /* prices */
  td:has(button), th { text-align: center; }       /* quantity cells and headers */
  .step {                                          /* round "−" / "+" buttons */
    width: 26px; height: 26px; padding: 0;
    border: 1px solid #ccc; border-radius: 50%;
    background: #fff; font-size: 16px; line-height: 1; cursor: pointer;
  }
  .step:hover { background: #eee; }
  .step:disabled { opacity: .3; cursor: default; }
  .qty { display: inline-block; width: 2em; }
  .qty.zero { color: #bbb; }
  th:first-child { text-align: left; }
  tfoot th { border-bottom: 0; }                   /* total and diff rows */
  .cheaper { color: #1a7f37; }                     /* diff vs option 1 */
  .pricier { color: #cf222e; }
  .delete {                                        /* "×" after the last option's name */
    margin-left: 4px; padding: 0 4px;
    border: 0; background: none; color: #888; font-size: 16px; cursor: pointer;
  }
  .delete:hover { color: #cf222e; }
  .settings { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
  .settings label { display: block; margin-bottom: 4px; }
  .settings textarea { max-width: 100%; }
</style>
</head>
<body>
<table id="table">
  <thead><tr><th>Item</th><th>Price</th></tr></thead>
  <tbody></tbody>
  <tfoot>
    <tr><th>Total</th><th></th></tr>
    <tr hidden><th>Tax</th><th></th></tr>
    <tr hidden><th>Total with tax</th><th></th></tr>
    <tr><th>Diff vs 1</th><th></th></tr>
  </tfoot>
</table>

<!-- One item row; a quantity cell is appended to it per option -->
<template id="row-template">
  <tr><td class="name"></td><td class="price"></td></tr>
</template>
<template id="cell-template">
  <td>
    <button class="step" data-d="-1">−</button>
    <span class="qty"></span>
    <button class="step" data-d="1">+</button>
  </td>
</template>
<!-- Header extras: "×" on the last option, "Add option" in the column after it -->
<template id="delete-template">
  <button class="delete">×</button>
</template>
<template id="add-template">
  <th><button class="add">Add option</button></th>
</template>

<!-- Items list and tax side by side; the tax wraps under on small screens -->
<div class="settings">
  <div>
    <label for="list">Items, one per line as <code>Name,price</code></label>
    <textarea id="list" rows="8" cols="40"></textarea>
  </div>
  <div>
    <label for="tax">Tax (%)</label>
    <input id="tax" inputmode="decimal" size="5">
  </div>
</div>
<p><button id="apply">Apply list</button></p>

<script>
// State lives in the URL (see below).
// items: [name, cents]   options: one { itemIndex: quantity } object per option
const table = document.getElementById('table');
const list = document.getElementById('list');
const taxInput = document.getElementById('tax');

// "€ 12,50" -> 1250 (null if not a number)
function toCents(text) {
  const n = Number(text.replace(/[€$\s]/g, '').replace(',', '.'));
  return text.trim() && Number.isFinite(n) ? Math.round(n * 100) : null;
}

// "20", "20 %", "7,5" -> 20, 20, 7.5 (0 if empty or not a number)
function toRate(text) {
  const n = Number(text.replace(/[%\s]/g, '').replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? n : 0;
}

const format = cents => (cents / 100).toFixed(2);
const clone = id => document.getElementById(id).content.firstElementChild.cloneNode(true);

function th(text) {
  const cell = document.createElement('th');
  cell.textContent = text;
  return cell;
}

// Every param is an item (?Coins=19.90&Dice=7), except the ones starting with "_":
// _sc=0.2x3,1 means option 1 has item 0 once and item 2 three times, option 2 has item 1.
// _tax=20 is the tax rate in percent.
const params = new URLSearchParams(location.search);
let items = [];
for (const [name, price] of params) {
  const cents = toCents(price);
  if (!name.startsWith('_') && cents !== null) items.push([name, cents]);
}
let taxRate = toRate(params.get('_tax') ?? '');
taxInput.value = taxRate || '';
let options = (params.get('_sc') ?? ',').split(',').map(s => {
  const ticked = {};
  for (const entry of s ? s.split('.') : []) {
    const [i, qty = 1] = entry.split('x').map(Number);
    if (items[i] && qty > 0) ticked[i] = qty;
  }
  return ticked;
});

function save() {
  const p = new URLSearchParams(items.map(([name, cents]) => [name, format(cents)]));
  p.append('_sc', options.map(ticked =>
    Object.entries(ticked).map(([i, qty]) => qty > 1 ? i + 'x' + qty : i).join('.')).join(','));
  if (taxRate) p.append('_tax', taxRate);
  history.replaceState(null, '', '?' + p);
}

function render() {
  const [headRow] = table.tHead.rows;
  const [totalRow, taxRow, withTaxRow, diffRow] = table.tFoot.rows;

  // Remove the previous option columns (keep the first two cells)
  for (const row of [headRow, totalRow, taxRow, withTaxRow, diffRow]) {
    while (row.cells.length > 2) row.deleteCell(-1);
  }

  options.forEach((_, s) => headRow.append(th(`Option ${s + 1}`)));
  // The last option can be deleted, as long as one is left
  if (options.length > 1) {
    const del = clone('delete-template');
    del.setAttribute('aria-label', `Delete option ${options.length}`);
    headRow.lastChild.append(del);
  }
  headRow.append(clone('add-template'));

  // One row per item, one quantity cell per option
  table.tBodies[0].replaceChildren(...items.map(([name, cents], i) => {
    const row = clone('row-template');
    row.querySelector('.name').textContent = name;
    row.querySelector('.price').textContent = format(cents);

    options.forEach((ticked, s) => {
      const qty = ticked[i] || 0;
      const cell = clone('cell-template');
      const [minus, plus] = cell.querySelectorAll('button');
      const count = cell.querySelector('.qty');

      Object.assign(minus.dataset, { s, i });
      Object.assign(plus.dataset, { s, i });
      minus.setAttribute('aria-label', `Remove one ${name} in option ${s + 1}`);
      plus.setAttribute('aria-label', `Add one ${name} in option ${s + 1}`);
      minus.disabled = !qty;
      count.textContent = qty;
      count.classList.toggle('zero', !qty);
      row.append(cell);
    });
    return row;
  }));

  const totals = options.map(ticked =>
    Object.entries(ticked).reduce((sum, [i, qty]) => sum + items[i][1] * qty, 0));
  totals.forEach(total => totalRow.append(th(format(total))));

  // Tax rows, only shown when a tax rate is set
  const taxes = totals.map(total => Math.round(total * taxRate / 100));
  const finals = totals.map((total, s) => total + taxes[s]);
  taxRow.hidden = withTaxRow.hidden = !taxRate;
  taxRow.cells[0].textContent = `Tax (${taxRate}%)`;
  taxes.forEach(tax => taxRow.append(th(format(tax))));
  finals.forEach(final => withTaxRow.append(th(format(final))));

  // Difference with option 1 (the reference), on the amount actually paid
  finals.forEach((total, s) => {
    const diff = total - finals[0];
    const cell = th(s === 0 ? '' : (diff > 0 ? '+' : '') + format(diff));
    if (diff < 0) cell.className = 'cheaper';
    if (diff > 0) cell.className = 'pricier';
    diffRow.append(cell);
  });

  list.value = items.map(([name, cents]) => name + ',' + format(cents)).join('\n');
}

// "+" / "−" buttons: change the quantity by one (0 removes the item)
table.addEventListener('click', e => {
  const { s, i, d } = e.target.dataset;
  if (!d) return;
  const qty = (options[s][i] || 0) + Number(d);
  if (qty > 0) options[s][i] = qty;
  else delete options[s][i];
  save();
  render();
  // keep keyboard focus on the same button ("+" if "−" just got disabled)
  const same = table.querySelector(`[data-s="${s}"][data-i="${i}"][data-d="${d}"]:enabled`);
  (same || table.querySelector(`[data-s="${s}"][data-i="${i}"][data-d="1"]`)).focus();
});

// Replace the item list from the textarea (lines that don't parse are skipped)
document.getElementById('apply').addEventListener('click', () => {
  items = [];
  for (const line of list.value.split('\n')) {
    const comma = line.indexOf(',');
    const name = line.slice(0, comma).trim();
    const cents = comma > 0 ? toCents(line.slice(comma + 1)) : null;
    if (name && cents !== null) items.push([name, cents]);
  }
  options = options.map(() => ({}));
  save();
  render();
});

// "Add option" / "×" in the header (focus goes back to "Add option", which was rebuilt)
table.tHead.addEventListener('click', e => {
  if (e.target.matches('.add')) options.push({});
  else if (e.target.matches('.delete')) options.pop();
  else return;
  save();
  render();
  table.querySelector('.add').focus();
});

// Tax rate: applied as you type
taxInput.addEventListener('input', () => {
  taxRate = toRate(taxInput.value);
  save();
  render();
});

render();
</script>
</body>
</html>
